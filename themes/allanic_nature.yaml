# Allanic Nature Theme — PLACEHOLDER
# Le contenu final sera remplacé par le thème extrait par le persona designer
# (task_19195). Ce placeholder existe pour valider la structure HACS.
#
# Deux variants : allanic_nature (dark) + allanic_nature_light (light).
# Optimisé pour Kindle Fire en mode wall display (écran toujours allumé,
# contraste élevé, palette sobre nature).

allanic_nature:
  # === Couleurs principales (placeholder) ===
  primary-color: "#4a7c59"
  accent-color: "#d4a373"
  primary-background-color: "#1a1f1c"
  secondary-background-color: "#222926"
  card-background-color: "#252b28"
  primary-text-color: "#e8ebe6"
  secondary-text-color: "#9fa8a3"
  divider-color: "rgba(232, 235, 230, 0.08)"

  # === Cartes ===
  ha-card-background: "#252b28"
  ha-card-border-radius: "12px"
  ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.25)"

  # === État ===
  state-icon-color: "#d4a373"
  state-icon-active-color: "#a3c585"
  state-icon-unavailable-color: "#5a635e"

  # === Sidebar ===
  sidebar-background-color: "#1a1f1c"
  sidebar-text-color: "#e8ebe6"
  sidebar-selected-background-color: "#2c3530"
  sidebar-selected-text-color: "#a3c585"
  sidebar-icon-color: "#9fa8a3"
  sidebar-selected-icon-color: "#a3c585"

  # === App header ===
  app-header-background-color: "#1a1f1c"
  app-header-text-color: "#e8ebe6"

allanic_nature_light:
  # === Variant light (placeholder) ===
  primary-color: "#4a7c59"
  accent-color: "#a05a2c"
  primary-background-color: "#f5f1e8"
  secondary-background-color: "#ebe6d8"
  card-background-color: "#ffffff"
  primary-text-color: "#1f2420"
  secondary-text-color: "#5a635e"
  divider-color: "rgba(31, 36, 32, 0.08)"

  ha-card-background: "#ffffff"
  ha-card-border-radius: "12px"
  ha-card-box-shadow: "0 2px 6px rgba(0, 0, 0, 0.08)"

  state-icon-color: "#a05a2c"
  state-icon-active-color: "#4a7c59"
  state-icon-unavailable-color: "#a8b0aa"

  sidebar-background-color: "#ebe6d8"
  sidebar-text-color: "#1f2420"
  sidebar-selected-background-color: "#dcd3bd"
  sidebar-selected-text-color: "#4a7c59"
  sidebar-icon-color: "#5a635e"
  sidebar-selected-icon-color: "#4a7c59"

  app-header-background-color: "#ebe6d8"
  app-header-text-color: "#1f2420"
