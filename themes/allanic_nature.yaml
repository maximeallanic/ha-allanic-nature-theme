# ══════════════════════════════════════════════════════════════════════════════
#  ALLANIC NATURE — Thème Home Assistant
#  Version: 0.8.0 (CARTES TEAL PARTOUT — 100 % VARIABLES, AUCUN CARD-MOD)
#   - Cartes teal #0D5D6D + texte clair + accents cyan #00B2C6 dans les 2 modes
#     (tout le bloc "carte" est COMMUN). Seuls le FOND DE PAGE et le CHROME
#     (sidebar, header, dividers, titres de section) changent selon le mode :
#       • dark  = page quasi-noir, sidebar sombre, titres clairs
#       • light = page claire #EDF4F5, sidebar claire, titres de section foncés
#   - Aucun card-mod (inutile : cartes teal identiques dans les 2 modes).
#   ⚠️ NOTE (mode light) : les data-table reprennent des couleurs de PAGE incompatibles
#     avec le choix « cartes teal » (group-header = --primary-background-color + texte
#     clair → illisible ; bordures de ligne = --divider-color clair). NON couvrable par
#     card-mod 4.2.1 (type root = hui-root, absent des pages de config) ni par variable
#     native → corrigé par le module www/allanic-data-table.js (frontend.extra_module_url).
#   - Bascule du mode = browser_mod.set_theme dark: dark|light (push explicite
#     par tablette, JAMAIS prefers-color-scheme — WebView Kindle).
#  Auteur: Designer Bleuenn / Personas Studio — DA allanic.me (teal #0D5D6D / cyan #00B2C6)
#  Typo: Nunito Sans · Cibles: Kindle Fire 5th Gen (WebView ~Chromium 70-80)
#  ⚠️ Kindle : pas de blur/gradients animés, fonds solides, ombres légères.
# ══════════════════════════════════════════════════════════════════════════════

allanic_nature:
  # ══════════════════════════════════════════════════════════════════════════
  #  COMMUN — bloc CARTE (teal) + accents, identique dark ET light
  # ══════════════════════════════════════════════════════════════════════════
  primary-font-family: "'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"

  # ── TEXTE (clair, sur cartes teal) ─────────────────────────
  primary-text-color: "#E8F4F5"
  text-primary-color: "#FFFFFF"
  secondary-text-color: "#C8E8EC"
  disabled-text-color: "#5E9098"

  # ── PALETTE ACCENTS ────────────────────────────────────────
  primary-color: "#00B2C6"
  accent-color: "#0D5D6D"

  # ── CARTES (teal plein, identiques dark/light) ─────────────
  card-background-color: "#0D5D6D"
  paper-card-background-color: "#0D5D6D"
  paper-listbox-background-color: "#0D5D6D"
  ha-card-background: "#0D5D6D"
  ha-card-border-radius: "12px"
  ha-card-border-width: "0px"
  ha-card-border-color: "#0A4D5C"
  ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.45)"
  mdc-theme-surface: "#0D5D6D"

  # ── ICÔNES ─────────────────────────────────────────────────
  state-icon-color: "#6FB5BD"
  state-icon-active-color: "#00B2C6"
  paper-item-icon-color: "#00B2C6"
  paper-item-icon-active-color: "#00B2C6"
  app-header-selection-bar-color: "#00B2C6"
  # Tile card : icône d'état INACTIF = --tile-icon-color ← --tile-color ← --state-inactive-color
  # (confirmé via tile-card-style.ts). #B9D9DF était trop désaturé (lu comme gris) →
  # teal clair franc, visible et coloré sur carte teal, sans toucher aux icônes actives.
  state-inactive-color: "#7FCFD8"

  # ── INTERRUPTEURS / SLIDERS ────────────────────────────────
  switch-checked-color: "#00B2C6"
  switch-checked-button-color: "#00B2C6"
  switch-checked-track-color: "#1A5560"
  switch-unchecked-color: "#2A4A4F"
  paper-toggle-button-checked-button-color: "#00B2C6"
  paper-toggle-button-checked-bar-color: "#1A5560"
  slider-color: "#00B2C6"
  info-color: "#00B2C6"

  # ── ÉTATS SÉMANTIQUES + ENERGY (vifs sur teal) ─────────────
  success-color: "#1B9A60"
  warning-color: "#E89318"
  error-color: "#E0493A"
  energy-grid-consumption-color: "#00B2C6"
  energy-solar-color: "#E89318"
  energy-battery-in-color: "#1B9A60"

  # ── BADGE ──────────────────────────────────────────────────
  label-badge-background-color: "#0D5D6D"
  label-badge-text-color: "#FFFFFF"
  label-badge-border-color: "#00B2C6"

  # ── ASSIST-CHIP FILLED (ex. états d'alarme « Désactivée ») ──
  # Fond par défaut = --primary-color (cyan vif) → texte clair peu contrasté.
  # Teal = plus foncé et plus lisible. (N'affecte que les chips filled.)
  ha-assist-chip-filled-container-color: "#0D5D6D"

  # ── MARKDOWN / DIALOGUES (sur surface teal → encres claires) ──
  markdown-text-color: "#E8F4F5"
  markdown-link-color: "#4FD0E0"
  markdown-code-background-color: "#16302E"
  markdown-code-text-color: "#E8F4F5"
  mdc-dialog-content-ink-color: "#E8F4F5"
  mdc-dialog-heading-ink-color: "#E8F4F5"
  ha-dialog-header-title-height: "auto"

  # ── ONGLETS ────────────────────────────────────────────────
  ha-tab-active-text-color: "#FFFFFF"
  mdc-tab-text-label-color-default: "#E8F4F5"
  # NB : l'onglet ACTIF (ha-tab) colore texte + soulignement avec --primary-color
  # (cyan) en mode large, et une pastille assist-chip en mode étroit. Comme
  # --primary-color est global, la pastille teal foncé choisie est appliquée par le
  # module www/allanic-data-table.js (CSS ciblé dans le shadow de ha-tab), pas ici.

  # ── TOOLTIP (foncé = lisible dans les 2 modes) ─────────────
  ha-tooltip-background-color: "#162426"
  ha-tooltip-text-color: "#E8F4F5"

  # ── DROPDOWN / MENU (panneau teal, items hover/sélection) ──
  ha-border-radius-md: "12px"
  ha-color-on-neutral-normal: "#E8F4F5"
  ha-color-border-neutral-quiet: "#0A4D5C"
  ha-color-fill-neutral-normal-resting: "#0A1A1D"
  ha-color-fill-neutral-normal-hover: "#0E2428"
  ha-color-fill-neutral-normal-active: "#0A1A1D"
  wa-color-neutral-fill-normal: "#14788C"
  ha-color-fill-primary-quiet-resting: "#08363D"
  ha-color-fill-primary-quiet-hover: "#0C4A54"

  # ── BOUTONS (ha-button WebAwesome — brand / accent / danger / neutral) ──
  # WebAwesome : filled=fill-normal+on-normal | plain/outlined=on-normal (fond transparent)
  #              accent=fill-loud+on-loud. on-normal est PARTAGÉ filled+plain → doit être
  #              clair (lisible en plain sur carte teal) → donc fill-normal doit être foncé.
  # FILLED brand = fond teal foncé (distinct de la carte) + texte cyan clair
  ha-color-fill-primary-normal-resting: "#0A4A56"
  ha-color-fill-primary-normal-hover: "#0E5C6B"
  ha-color-fill-primary-normal-active: "#083B45"
  # texte filled/plain/outlined (= on-normal) : cyan clair (lisible sur carte teal)
  ha-color-on-primary-normal: "#4FD0E0"
  # ACCENT/loud = fond CYAN vif (ressort sur la carte teal) + texte foncé
  ha-color-fill-primary-loud-resting: "#00B2C6"
  ha-color-fill-primary-loud-hover: "#22BECF"
  ha-color-fill-primary-loud-active: "#0098AB"
  ha-color-on-primary-loud: "#06363D"
  # plain/outlined quiet = cyan clair
  ha-color-on-primary-quiet: "#4FD0E0"
  ha-color-fill-primary-quiet-active: "#0F5260"
  ha-color-primary-50: "#2A9DB0"
  # DANGER filled
  ha-color-fill-danger-normal-resting: "#D14334"
  ha-color-fill-danger-normal-hover: "#E0493A"
  ha-color-fill-danger-normal-active: "#B0301F"
  ha-color-on-danger-normal: "#FFFFFF"
  # NEUTRAL filled (fond foncé + texte clair)
  ha-color-fill-neutral-loud-resting: "#0A1A1D"
  ha-color-on-neutral-loud: "#E8F4F5"

  # ── RIPPLE / STATE-LAYER ───────────────────────────────────
  mdc-ripple-color: "#00B2C6"
  mdc-ripple-hover-opacity: "0.08"
  mdc-ripple-focus-opacity: "0.12"
  mdc-ripple-press-opacity: "0.16"
  ha-ripple-color: "#00B2C6"
  ha-ripple-hover-opacity: "0.08"
  ha-ripple-pressed-opacity: "0.16"
  paper-item-focused-before-background: "#00B2C6"
  paper-item-focused-before-opacity: "0.20"

  # ── INPUTS (FONDU TOTAL : même teal que les cartes, sans bordure) ──
  # Choix Maxime 2026-06-11 : les champs reprennent le fond des cartes #0D5D6D.
  # Repérables seulement par le label + le soulignement au focus (look épuré).
  input-fill-color: "#0D5D6D"
  input-ink-color: "#E8F4F5"
  input-label-ink-color: "#9FD0D6"
  input-dropdown-bg-color: "#0D5D6D"
  mdc-text-field-ink-color: "#E8F4F5"
  mdc-text-field-label-ink-color: "#9FD0D6"
  mdc-text-field-fill-color: "#0D5D6D"
  mdc-select-ink-color: "#E8F4F5"
  mdc-select-label-ink-color: "#9FD0D6"

  # ── DESIGN SYSTEM HA 2026 (tokens --ha-color-*) — MAPPING SOMBRE ──
  # Le thème custom n'hérite PAS du bloc « dark » de HA → ces tokens restaient
  # clairs (surfaces blanches, form-background neutral-95, textes foncés). Les
  # composants modernes (ha-input, ha-select/ha-picker-field, ha-checkbox,
  # sélecteur de cartes) les lisent → fonds blancs. On fournit le mapping sombre.
  # Surfaces + textes du système 2026
  ha-color-surface-default: "#0D2E33"
  ha-color-surface-low: "#0A2429"
  ha-color-surface-lower: "#08191D"
  ha-color-on-surface-default: "#E8F4F5"
  ha-color-text-primary: "#E8F4F5"
  ha-color-text-secondary: "#9FD0D6"
  ha-color-text-disabled: "#5E9098"
  ha-color-text-link: "#4FD0E0"
  # Fond des CHAMPS de formulaire : ha-input (texte) + ha-picker-field (select)
  # FONDU TOTAL = teal des cartes (cf. bloc INPUTS). Hover/disabled = nuances teal
  # très légères pour un minimum de feedback, sans rompre le fondu.
  ha-color-form-background: "#0D5D6D"
  ha-color-form-background-hover: "#0E5C6B"
  ha-color-form-background-disabled: "#0A4D5C"
  # CHECKBOX inactive (retombe sinon sur --wa-color-surface-raised = blanc)
  ha-checkbox-background-color: "#122A30"
  ha-checkbox-border-color: "#4A8088"
  # ÉDITEUR DE CODE : gouttière (le fond principal = code-editor-background-color)
  code-editor-gutter-color: "#06141A"

  # ── ÉDITEUR DE CODE (CodeMirror) ──────────────────────────
  code-editor-background-color: "#08181C"
  codemirror-keyword: "#5DD8F0"
  codemirror-string: "#7EC99A"
  codemirror-property: "#E8F4F5"
  codemirror-number: "#F0C060"
  codemirror-comment: "#5A8A90"
  codemirror-atom: "#B09FD8"
  codemirror-meta: "#8AACB0"
  codemirror-tag: "#5DD8F0"

  # ── MUSHROOM / TOKENS RGB (cyan) ───────────────────────────
  rgb-teal: "0, 178, 198"
  mush-rgb-teal: "0, 178, 198"
  rgb-primary-color: "0, 178, 198"
  rgb-accent-color: "13, 93, 109"
  rgb-state-light-active: "0, 178, 198"
  rgb-state-vacuum-cleaning: "0, 178, 198"
  mush-rgb-primary: "0, 178, 198"

  # ── CARD-MOD (ciblé, mode light uniquement) ────────────────
  # Active card-mod pour le SEUL cas non couvrable par variable native : les
  # ha-tip des Réglages, qui lisent --secondary-text-color (clair, pour cartes
  # teal) et tombent donc clair-sur-clair sur la page claire. Le card-mod-root-yaml
  # ciblé est défini uniquement dans modes.light (en dark le ha-tip est lisible).
  card-mod-theme: allanic_nature

  # ── CARD-MOD SIDEBAR : titre « Home Assistant » ────────────
  # Le titre .title de la sidebar lit --primary-text-color (clair, pour les cartes
  # teal) → clair sur sidebar claire en light = illisible. card-mod-sidebar injecte
  # dans le shadow de ha-sidebar (testé OK). On mappe sur --mush-title-color, foncé
  # en light / clair en dark → lisible dans les 2 modes. (card-mod atteint la
  # sidebar ; il n'atteint PAS les pages de config → cf. module www/allanic-data-table.js.)
  card-mod-sidebar: |
    .title {
      color: var(--mush-title-color, #0D2E33) !important;
    }

  modes:
    # ════════════════════════════════════════════════════════════════════════
    dark:    # page quasi-noir, chrome sombre, titres clairs
    # ════════════════════════════════════════════════════════════════════════
      primary-background-color: "#0B1215"
      secondary-background-color: "#0D1618"
      lovelace-background: "#0B1215"

      app-header-background-color: "#0A2E33"
      app-header-text-color: "#E8F4F5"

      sidebar-background-color: "#0A1A1D"
      sidebar-text-color: "#9FD0D6"
      sidebar-icon-color: "#6FB5BD"
      sidebar-selected-background-color: "#11343A"
      sidebar-selected-text-color: "#00B2C6"
      sidebar-selected-icon-color: "#00B2C6"

      divider-color: "#1C4248"
      light-primary-color: "#1A3A3E"

      mush-title-color: "#E8F4F5"
      mush-subtitle-color: "#9FD4DC"
      ha-heading-card-title-color: "#E8F4F5"
      ha-heading-card-subtitle-color: "#C8E8EC"

    # ════════════════════════════════════════════════════════════════════════
    light:   # page claire, chrome clair, titres de section FONCÉS (cartes teal)
    # ════════════════════════════════════════════════════════════════════════
      primary-background-color: "#EDF4F5"
      secondary-background-color: "#DEE9EA"
      lovelace-background: "#EDF4F5"

      app-header-background-color: "#0D5D6D"
      app-header-text-color: "#FFFFFF"

      sidebar-background-color: "#E6F2F3"
      sidebar-text-color: "#2C5F67"
      sidebar-icon-color: "#4A8088"
      sidebar-selected-background-color: "#C8DDE0"
      sidebar-selected-text-color: "#0A4D5C"
      sidebar-selected-icon-color: "#0A4D5C"

      divider-color: "#C5DADD"
      light-primary-color: "#BDD4D8"

      # titres de SECTION/VUE (sur la page claire) → foncés = lisibles
      mush-title-color: "#0D2E33"
      mush-subtitle-color: "#0A4D5C"
      ha-heading-card-title-color: "#0D2E33"
      ha-heading-card-subtitle-color: "#0A4D5C"

      # ── CARD-MOD CIBLÉ : ha-tip des Réglages ──
      # NOTE 2026-06-11 : ce bloc est probablement INERTE avec card-mod 4.2.1 (le type
      # « root » s'injecte sur hui-root, absent de la page Réglages). Conservé tel quel
      # faute de remplacement validé ; les correctifs data-table sont passés en module JS
      # (www/allanic-data-table.js). À migrer aussi vers le module si besoin.
      card-mod-root-yaml: |
        ha-config-dashboard$: |
          ha-tip {
            --secondary-text-color: #0A4D5C !important;
            --primary-text-color: #0D2E33 !important;
          }
        home-assistant-main$:
          ha-config-dashboard$: |
            ha-tip {
              --secondary-text-color: #0A4D5C !important;
              --primary-text-color: #0D2E33 !important;
            }
